minVersion: '2.31.2'
changelog:
    policy: auto
versioning:
    policy: auto
preReleaseCommand: node scripts/bump-cli-version.mjs
statusProvider:
    name: github
    config:
        contexts:
            - Build
            - Build standalone
artifactProvider:
    name: github
    config:
        artifacts:
            CI:
                - npm-tarball
                - standalone
targets:
    - name: npm
      access: public
      oidc: true
      includeNames: /^model-tides-\d.*\.tgz$/
    - name: github
      includeNames: /^(model-tides-\d.*\.tgz|model-tides-(linux|darwin)-(x64|arm64)|SHA256SUMS)$/
