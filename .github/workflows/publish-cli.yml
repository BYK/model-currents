name: Publish Model Tides CLI

on:
    push:
        tags: ['cli-v*']

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Verify tag matches CLI version
              run: test "$GITHUB_REF_NAME" = "cli-v$(node -p "require('./cli/package.json').version")"
            - run: npm publish ./cli --access public
