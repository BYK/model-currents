name: CI

on:
    push:
        branches: ['release/*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pack:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  package-manager-cache: false
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Pack only the CLI
              run: npm pack ./cli
            - uses: actions/upload-artifact@v4
              with:
                  name: npm-tarball
                  path: model-tides-*.tgz
                  if-no-files-found: error
