name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to release (or auto)
                required: false
            force:
                description: Force a release even with release blockers
                type: boolean
                default: false

jobs:
    release:
        name: Prepare release
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: write
            issues: write
        steps:
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
            - uses: actions/checkout@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 0
            - uses: getsentry/craft@25028d0646040cc0a669ae3314cbf884f4c4347a # 2.31.2
              with:
                  version: ${{ inputs.version }}
                  force: ${{ inputs.force }}
                  publish_repo: self
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
