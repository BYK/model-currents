name: Publish

on:
    issues:
        types: [labeled]

jobs:
    publish:
        if: >-
            github.event.label.name == 'accepted' &&
            github.event.issue.state == 'open' &&
            startsWith(github.event.issue.title, 'publish: BYK/model-tides@')
        name: Publish CLI release
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: write
            id-token: write
            issues: write
        timeout-minutes: 15
        steps:
            - name: Parse Craft release request
              id: request
              env:
                  ISSUE_TITLE: ${{ github.event.issue.title }}
              run: |
                  pattern='^publish: BYK/model-tides@((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$'
                  if [[ ! "$ISSUE_TITLE" =~ $pattern ]]; then
                      echo 'Not a Model Tides release request.' >&2
                      exit 1
                  fi
                  echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
            - uses: actions/checkout@v6
              with:
                  ref: release/${{ steps.request.outputs.version }}
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 0
            - name: Set release author
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Use npm with OIDC support
              run: npm install --global npm@11
            - name: Install pinned Craft
              run: |
                  curl --fail --silent --show-error --location \
                      --output "$RUNNER_TEMP/craft" \
                      https://github.com/getsentry/craft/releases/download/2.31.2/craft
                  chmod +x "$RUNNER_TEMP/craft"
            - name: Publish approved release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  "$RUNNER_TEMP/craft" publish "${{ steps.request.outputs.version }}" --no-input
            - name: Close release request
              if: success()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh issue close "${{ github.event.issue.number }}" --comment 'Published Model Tides CLI ${{ steps.request.outputs.version }}.'
